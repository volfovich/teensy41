; Teensy 4.1 audio DSP project
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41

; ---------------------------------------------------------------------------
; Firmware for the Teensy 4.1
; ---------------------------------------------------------------------------
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
board_build.f_cpu = 600000000L

build_flags =
    ; USB device = Serial (command shell) + MIDI (preset / parameter control).
    ; No USB audio: the Teensy core's USB audio is 16-bit / 44.1 kHz and needs the Audio Library.
    -D USB_MIDI_SERIAL
    ; -O2 (Teensy default). Alternatives: TEENSY_OPT_FASTEST (-O3), TEENSY_OPT_FASTEST_LTO, TEENSY_OPT_DEBUG
    -D TEENSY_OPT_FASTER
    ; Audio block size in frames at 48 kHz (lib/i2s32). In-to-out latency is about 2 blocks.
    -D DSP_BLOCK=32

; Extra warnings for our own code only (not the Teensy core).
; -Wdouble-promotion catches accidental double math (e.g. 0.5 instead of 0.5f).
build_src_flags =
    -Wall
    -Wextra
    -Wdouble-promotion

; Treat Teensy core / framework library headers as system headers (no warnings from them).
extra_scripts = pre:scripts/system_headers.py

; teensy-gui uses the Teensy Loader app; press the button on the board if it doesn't auto-reboot.
upload_protocol = teensy-gui
monitor_speed = 115200
monitor_filters = default, time

; ---------------------------------------------------------------------------
; Hardware test: PSRAM verification (replaces the app firmware while flashed)
;   pio run -e psram_test -t upload && pio device monitor -e psram_test
; ---------------------------------------------------------------------------
[env:psram_test]
extends = env:teensy41
build_flags =
    -D USB_SERIAL
    -D TEENSY_OPT_FASTER
build_src_filter = -<*> +<../hw_tests/psram_test.cpp>

; Deep PSRAM inspection (~4 min suite incl. clock margin + retention, then endless soak)
;   pio run -e psram_deep -t upload && pio device monitor -e psram_deep
[env:psram_deep]
extends = env:psram_test
build_src_filter = -<*> +<../hw_tests/psram_deep.cpp>

; ---------------------------------------------------------------------------
; Hardware test: I2S driver self-test on the bare board (replaces the app firmware while flashed)
; Needs one jumper wire: pin 7 (data out) -> pin 8 (data in).
;   pio run -e i2s_loopback -t upload && pio device monitor -e i2s_loopback
; ---------------------------------------------------------------------------
[env:i2s_loopback]
extends = env:teensy41
build_flags =
    -D USB_SERIAL
    -D TEENSY_OPT_FASTER
    -D DSP_BLOCK=32
build_src_filter = -<*> +<../hw_tests/i2s_loopback.cpp>

; ---------------------------------------------------------------------------
; Benchmark: NAM A2-Lite on the bare board, no audio I/O (replaces the app firmware while flashed)
; scripts/nam_core.py fetches the reference engine (NeuralAmpModelerCore + Eigen) into third_party/.
;   pio run -e nam_bench -t upload && pio device monitor -e nam_bench
; ---------------------------------------------------------------------------
[env:nam_bench]
extends = env:teensy41
build_flags =
    -D USB_SERIAL
    -D TEENSY_OPT_FASTER
    -std=gnu++20
build_unflags =
    -std=gnu++17
build_src_flags =
    -Wall
extra_scripts =
    pre:scripts/system_headers.py
    pre:scripts/nam_core.py
build_src_filter = -<*> +<../hw_tests/nam_bench.cpp>

; ---------------------------------------------------------------------------
; Benchmark + on-board correctness check of our own NAM A2-Lite engine (lib/dsp/src/dsp/nam).
; Bare board, no audio I/O (replaces the app firmware while flashed).
;   pio run -e nam_a2_bench -t upload && pio device monitor -e nam_a2_bench
; ---------------------------------------------------------------------------
[env:nam_a2_bench]
extends = env:teensy41
build_flags =
    -D USB_SERIAL
    -D TEENSY_OPT_FASTER
build_src_filter = -<*> +<../hw_tests/nam_a2_bench.cpp>

; ---------------------------------------------------------------------------
; Host-side unit tests for the portable DSP code in lib/dsp
;   pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
; No -Wdouble-promotion here: the tests ported from teensy-ir-loader print floats with printf
; throughout. It stays on for src/ in the firmware build.
build_flags =
    -std=c++17
    -Wall
    -Wextra
lib_ignore = i2s32
test_framework = unity
